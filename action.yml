name: gha-gitops-manifest-update
description: Iterates over YAML manifests (Kubernetes Deployment, ArgoCD Application, or ArgoCD ApplicationSet) and updates their image/tag - also renders manifests.

inputs:
  #image
  tag:
    type: string
    description: e.g. 1.2.3, 1.2.3-branch-name.12
    required: true
  tag-override:
    type: string
    description: e.g. latest, latest-dev
  image-registry:
    type: string
    description: e.g. ghcr.io/gh-user, xyz.azurecr.io or docker.io
    required: true
  image-repository:
    type: string
    description: e.g. [optional-prefix/]myimage
    required: true
  #chart
  chart-registry:
    type: string
    description: e.g. ghcr.io/gh-user, xyz.azurecr.io or docker.io
  chart-registry-username:
    type: string
  chart-registry-password:
    type: string
  chart-repository:
    type: string
    description: e.g. [optional-prefix/]charts/myname
  #manifest
  manifest-paths:
    type: string
    description: Space-separated YAML manifests which need to be updated e.g. src/workloads/manifest1.yaml src/workloads/manifest2.yaml
    required: true
  namespace:
    type: string
    description: Destination Kubernetes namespace for the application.
    required: true
  #tooling
  devcontainer-path:
    type: string
    description: e.g. .devcontainer/devcontainer.json
    default: .devcontainer/devcontainer.json
  #git
  git-repo-update:
    type: boolean
    description: If 'false' then skips the git operations entirely, e.g. action runs in demo mode
    default: true
  git-user-name:
    type: string
    description: e.g. GitHub Actions Bot
    default: GitHub Actions Bot
  git-user-email:
    type: string
    description: e.g. github-actions[bot]@users.noreply.github.com
    default: github-actions[bot]@users.noreply.github.com
  git-branch-name:
    type: string
    description: e.g. main
    default: main
  git-working-directory:
    type: string
    description: Working directory for git operations e.g. gitops/
    default: .

runs:
  using: composite
  steps:

    #Tool versions come from the GitOps repository's devcontainer.json and are passed on as step outputs.
    - name: read tool versions (1 of 3)
      id: tools
      shell: bash
      env:
        GIT_DIR: ${{ inputs.git-working-directory }}
        DEVCONTAINER_INPUT: ${{ inputs.devcontainer-path }}
      run: |
        set -euo pipefail
        GIT_DIR="${GIT_DIR%/}"
        if [[ "$GIT_DIR" != "." ]]; then
          FILE="$GIT_DIR/$DEVCONTAINER_INPUT"
        else
          FILE="$DEVCONTAINER_INPUT"
        fi
        if [[ ! -f "$FILE" ]]; then
          echo "::error file=$FILE::yq and Helm versions are managed by the devcontainer.json, '$FILE' is therefore required!"
          exit 1
        fi
        npm install --global json5
        #Convert into a temp copy: rewriting the file in place would leave it modified in the GitOps repository.
        DEVCONTAINER_JSON="$RUNNER_TEMP/devcontainer.json"
        json5 "$FILE" > "$DEVCONTAINER_JSON"
        YQ_VERSION=$(jq -r '.features[] | select(.yqVersion | . != null).yqVersion' "$DEVCONTAINER_JSON")
        HELM_VERSION=$(jq -r '.features[] | select(.helm | . != null).helm' "$DEVCONTAINER_JSON")
        [[ "$YQ_VERSION" =~ ^(latest|v[0-9]+(\.[0-9]+){0,2})$ ]] || { echo "::error file=$FILE::yqVersion '$YQ_VERSION' must be latest or vX.Y.Z."; exit 1; }
        [[ "$HELM_VERSION" =~ ^(latest|v?[0-9]+(\.[0-9]+){0,2})$ ]] || { echo "::error file=$FILE::helm '$HELM_VERSION' must be latest or X.Y.Z."; exit 1; }
        echo "yq=$YQ_VERSION helm=$HELM_VERSION"
        {
          echo "yq=$YQ_VERSION"
          echo "helm=$HELM_VERSION"
        } >> "$GITHUB_OUTPUT"

    - name: install yq (2 of 3)
      shell: bash
      env:
        YQ_VERSION: ${{ steps.tools.outputs.yq }}
      run: |
        set -euo pipefail
        case "$RUNNER_ARCH" in
          X64) ARCH=amd64 ;;
          ARM64) ARCH=arm64 ;;
          *) echo "::error::Unsupported runner architecture $RUNNER_ARCH."; exit 1 ;;
        esac
        if [[ "$YQ_VERSION" == "latest" ]]; then
          URL="https://github.com/mikefarah/yq/releases/latest/download/yq_linux_$ARCH"
        else
          URL="https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_$ARCH"
        fi
        sudo wget -q "$URL" -O /usr/bin/yq
        sudo chmod +x /usr/bin/yq
        yq --version

    - name: setup helm (3 of 3)
      uses: azure/setup-helm@v5
      with:
        version: ${{ steps.tools.outputs.helm }}
    #1. update the argocd application targetRevision to reflect the new helm chart version
    #2. expand out the helm chart with new helm chart version (optional)
    - name: update manifest(s)
      shell: bash
      env:
        GIT_WORKING_DIRECTORY: ${{ inputs.git-working-directory }}
        MANIFEST_PATHS: ${{ inputs.manifest-paths }}
        TAG: ${{ inputs.tag }}
        TAG_OVERRIDE: ${{ inputs.tag-override }}
        IMAGE_REGISTRY: ${{ inputs.image-registry }}
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        CHART_REGISTRY: ${{ inputs.chart-registry }}
        CHART_REGISTRY_USERNAME: ${{ inputs.chart-registry-username }}
        CHART_REGISTRY_PASSWORD: ${{ inputs.chart-registry-password }}
        CHART_REPOSITORY: ${{ inputs.chart-repository }}
        NAMESPACE: ${{ inputs.namespace }}
      run: "${{ github.action_path }}/.scripts/update-manifests.sh"

    - name: repo update
      if: inputs.git-repo-update == 'true'
      shell: bash
      env:
        GIT_WORKING_DIRECTORY: ${{ inputs.git-working-directory }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        GIT_BRANCH_NAME: ${{ inputs.git-branch-name }}
        NAMESPACE: ${{ inputs.namespace }}
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        TAG: ${{ inputs.tag }}
        MANIFEST_PATHS: ${{ inputs.manifest-paths }}
      run: "${{ github.action_path }}/.scripts/repo-update.sh"
